<!doctype html>
<html lang="{{code}}" dir="{{direction}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} | BigPlanner Partners</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{url}}">
{{alternates}}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BigPlanner Partners">
  <meta property="og:locale" content="{{locale}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="https://bigplanner.co.kr/images/fire-safety-building.webp">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    {{styles}}
    .handout { max-width: 58rem; }
    .handout h1 { max-width: 21ch; }
    .handout .intro { max-width: 60ch; }
    .handout .languages { margin-block-start: 1rem; }
    .secondary { border: 1px solid var(--green); border-radius: .4rem; padding: .67rem 1rem; background: transparent; color: var(--green); cursor: pointer; font: inherit; }
    .secondary:hover { background: #e9f0ec; }
    .secondary:focus-visible { outline: 3px solid #367e71; outline-offset: 4px; }
    .sections { display: grid; gap: 2rem; }
    .sections h2 { font-size: clamp(1.4rem, 3vw, 2.05rem); margin-block-end: .75rem; }
    .checks { margin-block: .5rem 0; padding-inline-start: 1.5rem; }
    .checks li + li { margin-block-start: .55rem; }
    .example { border-block: 1px solid var(--rule); padding-block: 1.4rem; }
    .example dl { display: grid; grid-template-columns: minmax(8rem, .42fr) minmax(0, 1fr); margin-block: .9rem 0; }
    .example dt, .example dd { padding-block: .38rem; margin: 0; border-block-start: 1px solid #e3ebe5; }
    .example dt { font-weight: 650; padding-inline-end: .55rem; }
    .note { color: var(--muted); margin-block-start: .75rem; }
    @media (max-width: 31rem) {
      .example dl { grid-template-columns: minmax(0, 1fr); }
      .example dd { border: 0; padding-block-start: 0; }
    }
    @media print {
      .screen-only, .site-header, footer { display: none !important; }
      .hero { background: #fff; }
      .handout { width: 100%; }
      .section { padding-block: .55rem; }
      .sections { gap: .8rem; }
      .example { break-inside: avoid; padding-block: .7rem; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap handout header-content">
      <a class="brand" href="/" lang="en" dir="ltr">BigPlanner <span>Partners</span></a>
      <a href="{{productPath}}">{{productLabel}}</a>
    </div>
  </header>
  <main>
    <section class="hero" aria-labelledby="title">
      <div class="wrap handout section">
        <h1 id="title">{{h1}}</h1>
        <p class="intro">{{intro}}</p>
        <div class="links screen-only">
          <a class="button" href="facilities-shift-handover-log.xlsx" download>{{download}}</a>
          <button type="button" class="secondary" id="print-checklist" hidden>{{print}}</button>
          <a href="{{shareUrl}}">{{share}}</a>
        </div>
        <nav class="languages screen-only" aria-label="{{languageLabel}}">
          {{navigation}}
        </nav>
      </div>
    </section>
    <div class="wrap handout section sections">
      <section aria-labelledby="check-title">
        <h2 id="check-title">{{checklistTitle}}</h2>
        <ol class="checks">
          {{checklist}}
        </ol>
        <p class="note">{{note}}</p>
      </section>
      <section class="example" aria-labelledby="example-title">
        <h2 id="example-title">{{exampleTitle}}</h2>
        <p>{{exampleIntro}}</p>
        <dl>
          {{example}}
        </dl>
      </section>
      <section class="screen-only" aria-labelledby="demo-title">
        <h2 id="demo-title">{{demoTitle}}</h2>
        <p>{{demoText}}</p>
        <div class="links">
          <a href="{{demoUrl}}">{{demoAction}}</a>
          <a href="{{requestUrl}}" hreflang="en">{{formAction}}</a>
        </div>
      </section>
    </div>
  </main>
  <footer><div class="wrap handout"><span lang="en" dir="ltr">BigPlanner Partners</span><a href="/privacy/" hreflang="ko">{{privacy}}</a></div></footer>
  <script>
    const printButton = document.querySelector('#print-checklist');
    printButton.addEventListener('click', () => window.print());
    printButton.hidden = false;
  </script>
</body>
</html>
